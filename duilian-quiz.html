function qLower(it){const c=split(it);const pool=uniqBy(SP.filter(x=>x.l!==c.l),x=>x.l);const near=pool.filter(x=>Math.abs(x.l.length-c.l.length)<=3);
 const r=pick(near.length>=3?near:pool,3);
 return{s:`上聯：<b>${esc(c.u)}</b><br>下聯應是哪一句？`,o:sh([c.l,...r.map(x=>x.l)]),a:c.l,h:`這副對聯與「${c.a}」有關`,e:`完整對聯：${esc(c.u)}／${esc(c.l)}（${esc(c.a)}）`}}
const ANS=[...new Set([...BZ,...MT].map(x=>x.a))];
function qBiz(it){const g=gp(it.a,BG);const r=pick(ANS.filter(x=>!g.includes(x)),3);
 return{s:`${disp(it.t)}<br>這副對聯最適合貼在哪裡／哪一行業？`,o:sh([it.a,...r]),a:it.a,e:`<b>${esc(it.a)}</b>：${esc(flat(it.t))}`}}
const ERAS=[...new Set(H.map(x=>x.era).filter(Boolean))];
function qEra(it){const g=gp(it.era,EG),used=new Set([g[0]]),r=[];for(const e of sh(ERAS)){const k=gp(e,EG)[0];if(!used.has(k)){used.add(k);r.push(e)}if(r.length==3)break}
 return{s:`${disp(it.t)}<br>此聯詠的人物 <b>${esc(it.a)}</b> 是哪個時代的人？`,o:sh([it.era,...r]),a:it.era,e:`<b>${esc(it.a)}</b>是${esc(it.era)}人物。聯語：${esc(flat(it.t))}`}}
const LV={1:{n:"關卡一",t:"人物聯猜人物",e:"🔍",c:"#e8590c"},2:{n:"關卡二",t:"上下聯配對",e:"🎧",c:"#1c7ed6"},3:{n:"關卡三",t:"商用對聯猜行業",e:"🦎",c:"#2f9e44"},5:{n:"偵探關",t:"時代判斷",e:"🕵️",c:"#0b7285"},6:{n:"挑戰關",t:"同時代人物大挑戰",e:"🎲",c:"#d9480f"},4:{n:"Boss 關",t:"綜合總決戰",e:"👑",c:"#9c36b5"}};
const ORD=[1,2,3,5,6,4].map(k=>[k,LV[k]]);
const HP=H.filter(x=>!NP.includes(x.a)),HE=HP.filter(x=>x.era),SPI=[...H,...BZ,...MT].filter(split),BI=uniqBy([...BZ,...MT],x=>x.a);
function gen(l,n=10){let q;
 if(l==1)q=pick(uniqBy(H,x=>x.a),n).map(x=>qWho(x,false));
 else if(l==2)q=pick(SPI,n).map(qLower);
 else if(l==3)q=pick(BI,n).map(qBiz);
 else if(l==5)q=pick(uniqBy(HE,x=>x.a),n).map(qEra);
 else if(l==6)q=pick(uniqBy(HE,x=>x.a),n).map(x=>qWho(x,true));
 else q=pick([...gen(1,4),...gen(2,3),...gen(3,3),...gen(5,3),...gen(6,3)],n);
 return q}

const key=q=>q.s+"|"+q.a;

function home(){document.body.classList.remove("big");const st=LS.get(PFX+"_st",{}),wb=LS.get(PFX+"_wb",{}),nw=Object.keys(wb).length;
 app.innerHTML=`<h1>${HOME_T}</h1><p class="sub">${HOME_S}</p>`+
 ORD.map(([k,v])=>`<button class="card lv" style="--c:${v.c}" data-l="${k}"><span class="e">${v.e}</span><span><b>${v.n}：${v.t}</b><small>每關 10 題</small></span><span class="st">${stars(st[k]||0)}</span></button>`).join("")+
 `<div class="card"><b>🧠 錯題本</b>（${nw} 題）<small style="color:var(--mu)">　答錯會自動收進來，連續答對 2 次才畢業</small><br><button class="btn" id="rv" ${nw?"":"disabled"}>複習錯題</button><button class="btn g" id="sh" ${nw?"":"disabled"}>🖨 列印我的錯題卷</button></div>
 <div class="card"><b>📥 題庫抽題與下載區</b><small style="color:var(--mu)">　自選範圍抽題，分「學生版／教師版」下載</small><br><button class="btn" id="bk">進入抽題區</button></div>

 app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>start(gen(+b.dataset.l),+b.dataset.l));
 app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>proj(+b.dataset.p));
 $("#sh").onclick=sheet;$("#bk").onclick=bank;

const BK={sel:new Set([1,2,3,5,6,4]),n:20,items:null};
const tx=s=>String(s).replace(/<[^>]+>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
const XE=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function docxXml(items,teacher){const F='<w:rFonts w:ascii="Microsoft JhengHei" w:eastAsia="Microsoft JhengHei" w:hAnsi="Microsoft JhengHei"/>';
 const P=(t,o={})=>`<w:p><w:pPr>${o.c?'<w:jc w:val="center"/>':""}${o.ind?'<w:ind w:left="400"/>':""}<w:spacing w:after="${o.ind?140:40}"/></w:pPr><w:r><w:rPr>${F}${o.b?"<w:b/>":""}${o.col?`<w:color w:val="${o.col}"/>`:""}<w:sz w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${XE(t)}</w:t></w:r></w:p>`;
 let b=P(TITLE+"　抽題卷（"+(teacher?"教師版":"學生版")+"）",{b:1,sz:36,col:"B3261E",c:1});
 b+=P(teacher?`共 ${items.length} 題・含解答與解析`:"班級：＿＿＿＿　座號：＿＿＿＿　姓名：＿＿＿＿＿＿　得分：＿＿＿＿",{col:"666666"});
 items.forEach((q,i)=>{b+=P(`（　）${i+1}. ${tx(q.s)}`,{b:1});b+=P(q.o.map((t,j)=>`(${"ABCD"[j]}) ${tx(t)}`).join("　　"),{ind:1})});
 if(teacher){b+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>'+P("解答與解析",{b:1,sz:32,col:"1E8A4C"});
  items.forEach((q,i)=>{b+=P(`${i+1}. ${"ABCD"[q.o.indexOf(q.a)]}　${tx(q.a)}　${tx(q.e)}`,{ind:1})})}
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1020" w:right="1020" w:bottom="1020" w:left="1020" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`}
async function mkDocx(items,teacher){const z=new JSZip();
 z.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
 z.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
 z.file("word/document.xml",docxXml(items,teacher));return z.generateAsync({type:"blob"})}
function bank(){document.body.classList.remove("big");
 app.innerHTML=`<h1>📥 題庫抽題與下載區</h1><p class="sub">自選範圍與題數抽出一份題組，再分別下載「學生版」與「教師版」（兩份來自同一次抽題）</p><div class="card"><b>① 選範圍</b>${ORD.map(([k,v])=>`<label style="display:block;margin:4px 0"><input type="checkbox" data-k="${k}" ${BK.sel.has(k)?"checked":""}> ${v.e} ${v.n}：${v.t}</label>`).join("")}<b>② 題數</b> <input id="nn" type="number" min="5" max="60" value="${BK.n}" style="width:72px;font:inherit"> 題<br><button class="btn" id="dr">🎲 抽題</button><button class="btn g" onclick="home()">返回首頁</button></div><div id="out"></div>`;
 app.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{c.checked?BK.sel.add(+c.dataset.k):BK.sel.delete(+c.dataset.k)});$("#dr").onclick=draw;if(BK.items)show()}
function draw(){BK.n=Math.max(5,Math.min(60,+$("#nn").value||20));const ks=ORD.map(x=>x[0]).filter(k=>BK.sel.has(k));
 if(!ks.length){$("#out").innerHTML='<p class="card">請至少選一個範圍。</p>';return}
 const per=Math.ceil(BK.n/ks.length)+3,seen=new Set;let all=[];ks.forEach(k=>gen(k,per).forEach(q=>{q.l=k;const id=key(q);if(!seen.has(id)){seen.add(id);all.push(q)}}));
 BK.items=pick(all,BK.n).sort((a,b)=>ks.indexOf(a.l)-ks.indexOf(b.l));show()}
function show(){const it=BK.items;$("#out").innerHTML=`<div class="card"><b>已抽出 ${it.length} 題</b>${it.length<BK.n?`<small style="color:var(--mu)">（所選範圍題庫不足 ${BK.n} 題，已全部抽出）</small>`:""}
 <div style="max-height:260px;overflow:auto;margin-top:8px;font-size:15px">${it.map((q,i)=>`<p>${i+1}. ${q.s.replace(/<small>.*?<\/small>/,"")}</p>`).join("")}</div></div>
 <div class="card" style="border-color:#1c7ed6"><b>🧒 學生版</b><small style="color:var(--mu)">　題目卷，答案欄空白，有姓名座號欄</small><br><button class="btn" data-d="0">下載 Word</button><button class="btn g" data-p="0">列印／存成 PDF</button></div>
 <div class="card" style="border-color:#c2255c"><b>👩‍🏫 教師版</b><small style="color:var(--mu)">　題目＋最後一頁解答與解析</small><br><button class="btn" data-d="1">下載 Word</button><button class="btn g" data-p="1">列印／存成 PDF</button></div><p id="msg" class="sub"></p>`;
 app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>dl(+b.dataset.d));app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>psheet(+b.dataset.p))}
async function dl(tc){const m=$("#msg");let d=null;try{d=await window.claude?.use("downloads")}catch(e){}
 if(!d){try{const bl=await mkDocx(BK.items,!!tc),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=(tc?"教師版":"學生版")+"_"+FN+".docx";document.body.appendChild(a);a.click();a.remove();m.textContent="✅ 已下載"}catch(e){m.textContent="下載失敗，請改用列印／存成 PDF。"}return}

function psheet(tc){const it=BK.items;app.innerHTML=`<div class="noprint"><button class="btn" onclick="print()">🖨 列印／存成 PDF</button><button class="btn g" onclick="bank()">返回抽題區</button></div><h1>${TITLE}　抽題卷（${tc?"教師版":"學生版"}）</h1><p>${tc?"含解答與解析":"班級＿＿　座號＿＿　姓名＿＿　得分＿＿"}</p>`+it.map((q,i)=>`<div class="card"><div class="stem">（　）${i+1}. ${q.s}</div>${q.o.map((t,j)=>`<div>（${"ABCD"[j]}）${hl(t)}</div>`).join("")}</div>`).join("")+(tc?`<h2 style="break-before:page">解答與解析</h2>`+it.map((q,i)=>`<p>${i+1}. ${"ABCD"[q.o.indexOf(q.a)]}　${hl(q.a)}　${q.e}</p>`).join(""):"")}
function sheet(){const w=Object.values(LS.get(PFX+"_wb",{})).map(x=>x.q);app.innerHTML=`<div class="noprint"><button class="btn" onclick="print()">🖨 列印／存成 PDF</button><button class="btn g" onclick="home()">返回</button></div><h1>我的錯題卷</h1><p>班級＿＿　座號＿＿　姓名＿＿</p>`+w.map((q,i)=>`<div class="card"><div class="stem">${i+1}. ${q.s}</div>${q.o.map((t,j)=>`<div>（${"ABCD"[j]}）${hl(t)}</div>`).join("")}</div>`).join("")+`<h2 style="break-before:page">解答</h2>`+w.map((q,i)=>`<p>${i+1}. ${hl(q.a)}　${q.e}</p>`).join("")}
function start(qs,l){S={qs,l,i:0,ok:0,combo:0};ask()}

  LS.set(PFX+"_wb",wb);$("#ex").innerHTML=(good?"🎉 答對了！":"💡 再記一次：")+"<br>"+q.e;$("#ex").classList.add("on");$("#nx").hidden=false;$("#nx").onclick=()=>{S.i++;ask()}})}
function end(){const k=S.ok>=9?3:S.ok>=7?2:S.ok>=5?1:0;if(S.l){const st=LS.get(PFX+"_st",{});st[S.l]=Math.max(st[S.l]||0,k);LS.set(PFX+"_st",st)}

function proj(l){document.body.classList.add("big");let qs=gen(l),i=0,rev=0,tm=[0,0,0,0];
 const draw=()=>{const q=qs[i];app.innerHTML=`<div class="top"><b>${LV[l].e} ${LV[l].n}：${LV[l].t}</b><span>第 ${i+1} / ${qs.length} 題　［空白鍵／點畫面下方按鈕］</span><button class="btn g" id="x">離開</button></div><div class="card"><div class="stem">${q.s}</div>${q.o.map((t,j)=>`<div class="o ${rev&&t===q.a?"ok":""}"><span>${"ABCD"[j]}</span><i style="font-style:normal">${hl(t)}</i></div>`).join("")}<div class="ex ${rev?"on":""}">${q.e}</div></div><button class="btn" id="go">${rev?"下一題 ➜":"揭曉答案"}</button><div class="tm">${tm.map((v,j)=>`<div>第${j+1}組<b>${v}</b><button class="btn g" data-t="${j}">＋1</button><button class="btn g" data-m="${j}">－1</button></div>`).join("")}</div>`;
  $("#x").onclick=()=>{document.onkeydown=null;home()};$("#go").onclick=nx;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=e=>{e.stopPropagation();tm[+b.dataset.t]++;draw()});app.querySelectorAll("[data-m]").forEach(b=>b.onclick=e=>{e.stopPropagation();tm[+b.dataset.m]--;draw()})};
 const nx=()=>{if(!rev){rev=1}else{rev=0;i++;if(i>=qs.length){qs=gen(l);i=0}}draw()};
