<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>詠人．對聯練習</title>
<style>
:root{
  --ink:#2b2420; --paper:#f6f0e4; --paper2:#efe6d3; --accent:#a3231f;
  --accent2:#7a1a17; --gold:#b8933f; --muted:#8a7f6d; --card:#fffdf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ece3d4; --paper:#1c1815; --paper2:#241f1a; --accent:#e05a52;
    --accent2:#f2867e; --gold:#d8b968; --muted:#a99d88; --card:#26211c;
  }
}
:root[data-theme="dark"]{
  --ink:#ece3d4; --paper:#1c1815; --paper2:#241f1a; --accent:#e05a52;
  --accent2:#f2867e; --gold:#d8b968; --muted:#a99d88; --card:#26211c;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; min-height:100%;
  background:var(--paper); color:var(--ink);
  font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:720px; margin:0 auto; padding:20px 16px 40px;}
header{text-align:center; margin-bottom:14px;}
header h1{font-size:1.5rem; margin:0 0 4px; letter-spacing:.15em; color:var(--accent2);}
header p{margin:0; color:var(--muted); font-size:.85rem;}
.tabs{display:flex; gap:8px; margin:16px 0; overflow-x:auto; padding-bottom:2px;}
.tab{
  flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--gold);
  background:transparent; color:var(--ink); font-size:.85rem; cursor:pointer; white-space:nowrap;
  font-family:inherit;
}
.tab.active{background:var(--accent); color:#fff8ec; border-color:var(--accent);}
.toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.toolbar input[type=text]{
  flex:1; min-width:140px; padding:9px 12px; border-radius:10px; border:1px solid var(--gold);
  background:var(--card); color:var(--ink); font-size:.9rem; font-family:inherit;
}
.toolbar button.icon{
  padding:9px 12px; border-radius:10px; border:1px solid var(--gold); background:var(--card);
  color:var(--ink); font-size:.85rem; cursor:pointer;
}
.progress{text-align:center; color:var(--muted); font-size:.8rem; margin-bottom:6px;}
.card{
  background:var(--card); border:1px solid var(--gold); border-radius:16px;
  padding:34px 22px; min-height:190px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,.08); position:relative;
}
.era{position:absolute; top:12px; left:16px; font-size:.72rem; color:var(--gold); letter-spacing:.1em;}
.num{position:absolute; top:12px; right:16px; font-size:.72rem; color:var(--muted);}
.speak-btn{
  position:absolute; bottom:12px; right:14px; width:38px; height:38px; border-radius:50%;
  border:1px solid var(--gold); background:var(--paper2); font-size:1.05rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:var(--ink);
}
.speak-btn:active{transform:scale(.94);}
.speak-btn.playing{background:var(--accent); color:#fff8ec; border-color:var(--accent);}
.couplet{
  font-size:1.18rem; line-height:2; writing-mode:horizontal-tb;
  white-space:pre-wrap; word-break:break-word;
}
.hint{margin-top:16px; font-size:.75rem; color:var(--muted);}
.answer{
  margin-top:18px; font-size:1.3rem; color:var(--accent); font-weight:700; letter-spacing:.08em;
  display:none;
}
.answer.show{display:block;}
.nav{display:flex; gap:10px; margin-top:16px;}
.nav button{
  flex:1; padding:12px; border-radius:12px; border:none; background:var(--accent2);
  color:#fff8ec; font-size:.95rem; cursor:pointer; font-family:inherit;
}
.nav button:active{opacity:.85;}
.nav button.secondary{background:var(--paper2); color:var(--ink); border:1px solid var(--gold);}
.list{display:none; margin-top:10px;}
.list.show{display:block;}
.list table{width:100%; border-collapse:collapse; font-size:.85rem;}
.list th,.list td{padding:8px 6px; border-bottom:1px solid var(--paper2); text-align:left; vertical-align:top;}
.list th{color:var(--muted); font-weight:600;}
.list-wrap{overflow-x:auto;}
.empty{text-align:center; color:var(--muted); padding:30px 0;}
.list td.spoiler{cursor:pointer; position:relative; color:var(--accent);}
.list td.spoiler .ans-text{display:none;}
.list td.spoiler .veil{color:var(--muted); font-size:.78rem;}
.list td.spoiler.revealed .veil{display:none;}
.list td.spoiler.revealed .ans-text{display:inline;}
footer{text-align:center; color:var(--muted); font-size:.72rem; margin-top:28px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>詠 人．對 聯 練 習</h1>
    <p>歷史人物聯 · 商用對聯 — 點卡片看答案</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-cat="hist">歷史人物聯（82）</button>
    <button class="tab" data-cat="match">商用配合題（5）</button>
    <button class="tab" data-cat="biz">商用問答題（96）</button>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="搜尋聯語或答案…">
    <button class="icon" id="shuffleBtn">🔀 隨機</button>
    <button class="icon" id="viewBtn">📋 列表</button>
  </div>

  <div class="progress" id="progress"></div>

  <div class="card" id="card">
    <span class="era" id="era"></span>
    <span class="num" id="num"></span>
    <button class="speak-btn" id="speakBtn" onclick="event.stopPropagation(); speakCurrent();" aria-label="朗讀">🔊</button>
    <div class="couplet" id="couplet"></div>
    <div class="hint" id="hint">點一下顯示答案</div>
    <div class="answer" id="answer"></div>
  </div>

  <div class="nav">
    <button class="secondary" id="prevBtn">← 上一題</button>
    <button id="nextBtn">下一題 →</button>
  </div>

  <div class="list-wrap list" id="listView">
    <table>
      <thead><tr><th style="width:10%">#</th><th>聯語</th><th style="width:22%">答案</th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>

  <footer>共 183 題 · 學生練習版（答案預設隱藏）</footer>
</div>

<script>

function norm(cat){
  // returns array of {num, era, text, ans}
  if(cat==='hist') return DATA.hist.map(x=>({num:x[0], era:x[1], text:x[2], ans:x[3]}));
  if(cat==='match') return DATA.match.map((x,i)=>({num:i+1, era:'配合題', text:x[0], ans:x[1]}));
  return DATA.biz.map(x=>({num:x[0], era:'', text:x[1], ans:x[2]}));
}

let state = { cat:'hist', items:[], order:[], idx:0, showAns:false, listMode:false, query:'' };

function applyFilter(){
  const base = norm(state.cat);
  const q = state.query.trim();
  state.items = q ? base.filter(it => it.text.includes(q) || it.ans.includes(q)) : base;
  state.order = state.items.map((_,i)=>i);
  state.idx = 0;
  state.showAns = false;
}

function shuffleOrder(){
  for(let i=state.order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [state.order[i],state.order[j]]=[state.order[j],state.order[i]];
  }
  state.idx = 0;
  state.showAns = false;
  render();
}

function speakCurrent(){
  if(!('speechSynthesis' in window)){ alert('此瀏覽器不支援語音朗讀'); return; }
  const total = state.items.length;
  if(!total) return;
  const it = state.items[state.order[state.idx]];
  window.speechSynthesis.cancel();
  let text = it.text.replace(/\//g, '，');
  if(state.showAns) text += '。答案：' + it.ans;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'zh-TW';
  u.rate = 0.85;
  const btn = document.getElementById('speakBtn');
  u.onstart = ()=> btn && btn.classList.add('playing');
  u.onend = ()=> btn && btn.classList.remove('playing');
  u.onerror = ()=> btn && btn.classList.remove('playing');
  window.speechSynthesis.speak(u);
}

function render(){
  const total = state.items.length;
  document.getElementById('progress').textContent = total ? `第 ${state.idx+1} / ${total} 題` : '';
  const cardEl = document.getElementById('card');
  if(!total){
    document.getElementById('era').textContent='';
    document.getElementById('num').textContent='';
    document.getElementById('couplet').textContent='';
    document.getElementById('hint').textContent='';
    document.getElementById('answer').classList.remove('show');
    cardEl.querySelector('#couplet').innerHTML = '<span style="color:var(--muted)">沒有符合的題目</span>';
  } else {
    const it = state.items[state.order[state.idx]];
    document.getElementById('era').textContent = it.era || '';
    document.getElementById('num').textContent = 'No.'+it.num;
    document.getElementById('couplet').textContent = it.text.replace(/\//g,'　／　');
    document.getElementById('hint').textContent = state.showAns ? '' : '點一下顯示答案';
    const ansEl = document.getElementById('answer');
    ansEl.textContent = it.ans;
    ansEl.classList.toggle('show', state.showAns);
  }
  renderList();
}

function renderList(){
  const body = document.getElementById('listBody');
  body.innerHTML = state.items.map(it=>
    `<tr><td>${it.num}</td><td>${it.text.replace(/\//g,'／')}</td><td class="spoiler" onclick="this.classList.toggle('revealed')"><span class="veil">點一下顯示</span><span class="ans-text">${it.ans}</span></td></tr>`
  ).join('');
}

document.getElementById('card').addEventListener('click', ()=>{
  if(!state.items.length) return;
  state.showAns = !state.showAns;
  render();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(!state.items.length) return;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  state.idx = (state.idx+1) % state.items.length;
  state.showAns = false;
  render();
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(!state.items.length) return;
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  state.idx = (state.idx-1+state.items.length) % state.items.length;
  state.showAns = false;
  render();
});
document.getElementById('shuffleBtn').addEventListener('click', shuffleOrder);
document.getElementById('viewBtn').addEventListener('click', ()=>{
  state.listMode = !state.listMode;
  document.getElementById('listView').classList.toggle('show', state.listMode);
  document.getElementById('card').style.display = state.listMode ? 'none' : 'flex';
  document.getElementById('progress').style.display = state.listMode ? 'none' : 'block';
  document.querySelector('.nav').style.display = state.listMode ? 'none' : 'flex';
  document.getElementById('viewBtn').textContent = state.listMode ? '🗂 卡片' : '📋 列表';
});
document.getElementById('search').addEventListener('input', (e)=>{
  state.query = e.target.value;
  applyFilter();
  render();
});
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.cat = btn.dataset.cat;
    document.getElementById('search').value='';
    state.query='';
    applyFilter();
    render();
  });
});

if(!('speechSynthesis' in window)){
  const sb = document.getElementById('speakBtn');
  if(sb) sb.style.display = 'none';
}

applyFilter();
render();
</script>
</body>
</html>
