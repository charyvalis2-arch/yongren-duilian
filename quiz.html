<script>
const PFX="yongren",HOME_T="🏮 詠人詩闖關站",HOME_S="詠人詩講義題庫・每次出題都不同",TITLE="詠人詩",FN="詠人詩抽題卷",WIN="太強了！詠人詩人物全拿下 🎉";
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const hl=s=>esc(s).replace(/「([^」]*)」/g,'<b>「$1」</b>');
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>sh(a).slice(0,n);
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const P=[{"c":"詩人文士","n":"李白","t":"酒中仙・謫仙人・青蓮居士","l":["天子呼來不上船，自稱臣是酒中仙／我本楚狂人，狂歌笑孔丘","五岳尋仙不辭遠，一生好入名山遊","花間一壺酒，獨坐無相親。舉杯邀明月，對影成三人","飛流直下三千尺，疑是銀河落九天","明主憐才赦酒狂，不知力士賤文章；當其醉草清平調，肯信長安是夜郎","昔年有狂客，號爾謫仙人，筆落驚風雨，詩成泣鬼神","曾拿千金裘換酒；奚屑五斗米折腰","我輩到此惟飲酒；先生在上莫言詩","一生好入名山，舉杯邀月；萬民長憶學士，歌詩銷憂","千古詩才，蓬萊文章建安骨；一身傲骨，青蓮居士謫仙人","青蓮應怪我來遲，不敢亂題詩，恐被隔江鸚鵡笑","口口詩無敵，飄然思不群。清新庾開府，俊逸鮑參軍（杜甫贈李白）","酒入豪腸，七分釀成了月光，剩下的三分嘯成劍氣，繡口一吐就半個盛唐（現代詩）","你原本是一朵好看的青蓮，腳在泥中，頭頂藍天，無潁川之水，一身紅塵已被酒精洗淨（現代詩）","酒後背手參觀瀑布最好，那名配劍吟詩的白衣人已擺出天下第一的起式（現代詩）","長安是一個宜酒宜詩不宜仙的地方，去吧！提起你的酒壺，挾起你的詩冊（現代詩）","自從那年賀知章眼花了，認你作謫仙，便更加佯狂（現代詩）","你曾是黃河之水天上來，陰山動，龍門開（現代詩）"],"o":"補充：賀知章稱他「謫仙人」；高力士脫靴、楊貴妃磨墨；〈清平調〉"},{"c":"詩人文士","n":"杜甫","t":"詩聖・詩史・少陵","l":["世上瘡痍，詩中聖哲；民間疾苦，筆底波瀾／讀書破萬卷，下筆如有神","草堂留後世；詩聖著春秋","忠愛託詩人，杅謫仙差許齊名，奚屑三唐科第；棲遲因地主，嚴節度頗稱知己","杜陵有布衣，老大意轉拙；許身一何愚，竊比稷與契","平生最愛說東坡，日啖荔枝三百顆；天下幾人學杜甫，安得廣廈千萬間","萬里飄零獨此身，詩魂終戀浣花村。寧貧寧凍寧饑死，一飯何曾忘至尊","間氣古今三足鼎：杜詩韓筆與顏書","千年前為秋風所破的茅屋，剩日下的竹影搖曳，我小立在那座新築新修的草堂（現代詩）"],"o":"補充：浣花草堂；〈茅屋為秋風所破歌〉「願蔽天下寒士盡歡顏」"},{"c":"詩人文士","n":"蘇軾","t":"東坡・髯蘇","l":["須關西大漢，銅琵琶，鐵綽板，唱「大江東去」／問汝平生功業，黃州惠州儋州","明月浩無邊，安排鐵板銅琶，我歌唱大江東去；春風睡正美，迢遞珠崖瓊島，更誰憐孤鶴南飛","大江東去，浪濤騰躍成千古，那一波是捉月人？那一波是溺水的大夫？赤壁下，人弔髯蘇猶似髯蘇在弔古（余光中，並詠李白、屈原）"],"o":"補充：豪放詞代表；貶謫三地；赤壁懷古"},{"c":"詩人文士","n":"陶潛","t":"陶淵明・五柳先生・彭澤令","l":["鳳凰不共雞爭食，莫怪先生懶折腰／採菊東籬下，悠然見南山","那老子彭澤縣懶坐衙，倦將文卷押，籬下看黃花，愛的是青山綠水，來報五柳莊幽靜煞！","蕭蕭五株門外柳，屈指重陽又，霜清紫蟹肥，露冷黃花瘦，白衣不來琴當酒","五柳莊前陶令宅，大似彭澤！無限黃花有誰戴？去來！去來！","質而綺，真且醇，自可傳之千古；樽中酒，籬下詩，豈甘了此一生","陶潛酷似臥龍豪，萬古潯陽松菊高；莫信詩人竟平澹，二分梁甫一分騷","南陽少，北窗老，兩臥千秋同矯矯。南陽慶遭逢，北窗終潦倒（並詠諸葛亮）","當年有個陶淵明，不惜性命只貪酒；骨硬不能深折腰，棄官歸來空兩手（現代詩）"],"o":"補充：不為五斗米折腰；愛菊、無弦琴、漉酒巾"},{"c":"詩人文士","n":"屈原","t":"三閭大夫・靈均","l":["何處招魂，香草還生三戶地；當年呵壁，湘流應識九歌心","把影子投在水上的，都患了潔癖，一種高貴的絕症，清芬從風裡來，楚歌從清芬裡來（現代詩）","菖蒲作劍，難斷離騷；雄黃入酒，不解天問；你的潔癖該怎樣濯清（現代詩）","沅湘流不盡，屈子怨何深，日暮秋風起，蕭蕭楓樹林（戴叔倫）","不肯迂迴入醉鄉，乍吞忠梗沒滄浪。至今祠畔猿啼月，了了猶疑恨楚王（汪遵）","皇覽揆餘初度兮，肇錫餘以嘉名，名餘曰正則兮，字餘曰靈均","穿起古時的衣裳，遂成遠戍人的心情，呼喚魂隨水散的故人（現代詩）","青史上你留下一片潔白，朝朝暮暮你行吟在楚澤（現代詩）"],"o":"補充：〈離騷〉〈天問〉〈九歌〉；投汨羅江，端午由來"},{"c":"詩人文士","n":"白居易","t":"樂天・香山居士","l":["楓葉蘆花雨鬢霜，櫻桃楊柳久相忘。當時莫怪青衫溼，不是琵琶也斷腸","中秋豈可無月，無月教我如何想像你早年的容顏，一夜的鄉心，五處的悸動（現代詩）","唐代論詩人，李杜以還，唯有幾篇新樂府；蘇州懷刺史，湖山之曲，尚留三廟舊祠堂","楓葉四弦秋，悵觸天涯遷謫恨；潯陽千尺水，勾留江上別離情","童子解吟長恨曲，胡兒能唱琵琶篇。文章已滿行人耳，一度思君一惘然"],"o":"補充：〈長恨歌〉〈琵琶行〉；新樂府；「一夜鄉心五處同」"},{"c":"詩人文士","n":"范仲淹","t":"文正公","l":["兵甲富於胸中，一代功名高宋室；憂樂關乎天下，千秋俎豆重蘇臺","窮秀才，憂天下。買義田，服西夏。寵與辱，皆自由，樹風範，稱一流","呂道人太無聊，八百里洞庭，飛過去，飛過來，一個神仙誰在眼？范秀才亦多事，數十年光景，甚麼先，甚麼後，萬家憂樂總關心","自有聲名垂宇宙，何妨憂樂異江湖"],"o":"補充：〈岳陽樓記〉「先天下之憂而憂，後天下之樂而樂」"},{"c":"詩人文士","n":"韓愈","t":"昌黎・文起八代之衰","l":["佛骨謫來，嶺海因而生色；鱷魚徙去，江湖自此澄清","百世之師，匹夫有志公可法；三書猶在，宰相無名鬼不靈","一封朝奏九重天，夕貶潮陽路八千。雲橫秦嶺家何在？雪擁藍關馬不前。好收吾骨瘴江邊"],"o":"補充：〈諫迎佛骨表〉〈祭鱷魚文〉〈師說〉"},{"c":"詩人文士","n":"陸游","t":"放翁","l":["國仇未報壯士老，匣中寶劍夜有聲","詩繼少陵，派開南宋；更入清風明月，池館重新接草堂"],"o":"補充：愛國詩人；〈書憤〉〈示兒〉"},{"c":"詩人文士","n":"辛棄疾","t":"稼軒","l":["髮白存壯心，醉裡挑燈看劍；筆禿難報國，夢回吹角連營","鐵板銅琵，繼東坡，高唱大江東去；美芹悲黍，冀南宋，莫隨鴻雁南來"],"o":"補充：愛國詞人；與蘇軾並稱「蘇辛」"},{"c":"詩人文士","n":"王維","t":"右丞・詩佛・摩詰","l":["輞川圖上看春暮；常記高人右丞句","寒山轉蒼翠，秋水日潺湲，倚杖柴門外，臨風聽暮蟬。復值接輿醉，狂歌五柳前（王維贈裴迪：接輿指裴迪，五柳指王維）"],"o":"補充：蘇軾評「詩中有畫，畫中有詩」；輞川別業；〈九月九日憶山東兄弟〉"},{"c":"詩人文士","n":"孟浩然","t":"孟山人・孟襄陽","l":["醉月頻中聖，迷花不事君"],"o":"補充：隱居鹿門山；〈春曉〉；與王維並稱「王孟」"},{"c":"詩人文士","n":"柳宗元","t":"河東・柳柳州","l":["才與福難兼，賈傅以來，文字潮儋同萬裏；地因人始重，河東而外，江山永柳各千秋"],"o":"補充：貶永州、柳州；〈永州八記〉；唐宋八大家"},{"c":"詩人文士","n":"李商隱","t":"玉谿生・義山","l":["望帝春心託杜鵑，佳人錦瑟怨華年"],"o":"補充：〈錦瑟〉；無題詩；莊生曉夢迷蝴蝶"},{"c":"詩人文士","n":"李煜","t":"南唐後主・詞帝","l":["南朝的時候我打此經過，寫了幾首詩，和女子調笑，他們稱我為帝王"],"o":"補充：亡國之君；「問君能有幾多愁」；後主詞"},{"c":"詩人文士","n":"李清照","t":"易安居士","l":["《大明湖》畔，《趵突泉》邊，故居在垂楊深處；《漱玉集》中，《金石錄》裡，文采有後主遺風"],"o":"補充：婉約派；《漱玉集》；濟南人；「生當作人傑，死亦為鬼雄」"},{"c":"詩人文士","n":"王安石","t":"荊公・臨川","l":["天變不足畏，祖宗不足法，人言不足恤，自古英雄欽卓識"],"o":"補充：熙寧變法；唐宋八大家；〈烏江亭〉翻案詩"},{"c":"詩人文士","n":"司馬光","t":"君實・溫公","l":["先生獨何事，四海望陶冶；兒童誦君實，走卒知司馬"],"o":"補充：主編《資治通鑑》；與王安石新舊黨爭"},{"c":"詩人文士","n":"王勃","t":"初唐四傑","l":["我輩復登臨，目極湖山千里而外；奇文共欣賞，人在水天一色之中"],"o":"補充：〈滕王閣序〉「落霞與孤鶩齊飛」；滕王閣對聯"},{"c":"詩人文士","n":"蒲松齡","t":"柳泉居士","l":["鬼狐有性格，笑罵成文章"],"o":"補充：《聊齋誌異》；「姑妄言之姑聽之」"},{"c":"詩人文士","n":"賈誼","t":"賈傅・賈生","l":["三年謫宦此棲遲，萬古惟留楚客悲"],"o":"補充：貶長沙王太傅；〈弔屈原賦〉〈過秦論〉"},{"c":"詩人文士","n":"梁實秋","t":"雅舍主人","l":["傾耳共清談，老去秋郎，別有幽懷人不識；極峰尊小品，久湮雅舍，卻因彩筆史長存"],"o":"補充：《雅舍小品》；翻譯《莎士比亞全集》"},{"c":"詩人文士","n":"關漢卿","t":"元曲四大家","l":["不是我竇娥發下這等無頭願，委實的冤情不淺"],"o":"補充：《竇娥冤》；元雜劇作家"},{"c":"忠臣名將","n":"諸葛亮","t":"臥龍・孔明・武鄉侯","l":["三顧頻繁天下計，兩朝開濟老臣心／兩表酬三顧，一對足千秋","南陽臥龍有大志，腹內雄兵正分奇","出師未捷身先死，長使英雄淚滿襟","成大事以小心，一生謹慎；仰宗臣之遺像，萬古清高","義膽忠肝，六經以來二表；託孤寄命，三代而後一人","可託六尺之孤，可寄百里之命，君子人與？君子人也；隱居以求其志，行義以達其道，吾聞其語，吾見其人","功蓋三分國，名成八陣圖。江流石不轉，遺恨失吞吳（杜甫）","早歲那知世事艱，中原北望氣如山。出師一表真名世，千載誰堪伯仲間（陸游書憤）","伯仲之間見伊呂，指揮若定失蕭曹；運移漢祚終難復，志決身殲軍務勞","管樂有才終不忝，關張無命欲何如？他年錦里經祠廟，梁父吟成恨有餘","收二川，排八陣，六出七擒，五丈原前，點四十九盞明燈，一心只為酬三顧；定西蜀，伏南蠻，東和北拒，卜金木五行爻卦，水裡偏能用火攻","梁父吟成高士志；出師表見老臣心","名士幾人兼將相；使君終古識英雄","興亡天定三分局；今古人思五丈原","廟垂二千年，問魏闕吳宮安在；人居三代下，比商伊周呂如何？","萬事俱備，只欠東風","巾扇任逍遙，試看抱膝長吟，高臥尚留名士跡；井廬空眷念，可憐鞠躬盡瘁，歸耕未遂老臣心","自任以天下之重如此；是知其不可而為之歟","已知天下三分鼎，猶竭人謀六出師","心在朝廷，原無論先主後主；名高天下，何必辨襄陽南陽","三分割據紆籌策，萬古雲霄一羽毛"],"o":"補充：隆中對、〈出師表〉、五丈原、空城計；〈梁父吟〉"},{"c":"忠臣名將","n":"岳飛","t":"武穆・鵬舉","l":["三字蒙冤，千秋湛血；一生忠勇，萬古綱常／靖康恥，猶未雪；臣子恨，何時滅","二帝蒙塵，淚血千秋含激憤，一生完節，清風萬古仰忠貞","報國精忠，三字獄冤千古白；以身作則，一篇詞著滿江紅","千秋冤獄莫須有，百戰忠魂歸去來","觀瞻氣象耀民魂，喜今朝祠堂重開；收拾山河酬壯志，看此日神州奮起，新程萬里駕長車","埋骨西湖土一丘，殘陽荒草幾經秋。中原望斷因公死，北客猶能說舊愁","青山有幸埋忠骨；白鐵無辜鑄佞臣","衛社稷，執干戈，差辛苦戰十年；聽鼓鼙，思將帥，不是冤深三字，怎能見一片忠心","王業偏安嘆息北征將士，精忠報國傷心南渡君臣"],"o":"補充：〈滿江紅〉；莫須有；墓在西湖，「青山有幸埋忠骨，白鐵無辜鑄佞臣」"},{"c":"忠臣名將","n":"文天祥","t":"文山・信國公","l":["人生自古誰無死，留取丹心照汗青","他們可以囚禁你的身，卻不能囚禁你的心你的靈魂（現代文）","久要不忘平生之言，古誼若龜鑑，忠肝若鐵石；敢問何謂浩然之氣，鎮地為河嶽，麗天為日星","哀哉宋遺臣，舊客丞相門。丞相既死節，有身恥空存","猶留正氣參天地，永剩丹心照今","天下太平，文官不愛錢，武官不怕死；乾坤正氣，下則為河嶽，上則為日星"],"o":"補充：〈正氣歌〉；狀元宰相；「吾能死，不能拜」"},{"c":"忠臣名將","n":"史可法","t":"梅花嶺・史閣部","l":["葬衣冠有淮南抔土，冰心鐵骨，好伴取嶺上梅花","死即可見左光斗，生不願作洪承疇。東風吹上梅花嶺，還剩幾分明月影？","殉社稷，只江北孤城，剩水殘山，尚留得風中勁草","佩武穆至言，不愛錢，不惜死；與文山比烈，曰取義，曰成仁","尚張睢陽為友，奉左忠毅為師；夢文信國而生，慕武鄉侯而死，復仇經九世，神州終見漢衣冠","生來自有文信國；死而後已武鄉侯"],"o":"補充：守揚州殉國，僅葬衣冠塚；相傳母夢文天祥而生"},{"c":"忠臣名將","n":"鄭成功","t":"國姓爺・延平郡王","l":["由秀才封王，為天下讀書人別開生面；驅異族出境，語中國有志者再鼓雄風","孤臣秉孤忠，浩氣磅礡留千古，正人扶正義，莫教成敗論英雄","開萬古得未曾有之奇，洪荒留此山川，作遺民世界；極一生無可如何之遇，缺憾還諸天地，是創格完人","賜國姓，家破君亡，永矢孤忠，創基業在山窮水盡；復父書，詞嚴義正，千秋大節享俎豆於堯天舜日","英雄應厄運而生，赤手擎天，存故國四十年正朔；開闢在神州以外，紅毛避地啟遐荒百萬眾題封"],"o":"補充：本名鄭森；趕走荷蘭人，收復臺灣"},{"c":"忠臣名將","n":"關羽","t":"關公・武聖・雲長","l":["赤面秉赤心，騎赤兔追風，馳驅時無忘赤帝；青燈觀青史，仗青龍偃月，隱微處不愧青天","師臥龍，友子龍，龍師龍友；兄玄德，弟翼德，德兄德弟","生蒲州，輔豫州，保荊州，鼎峙西南，掌底江山歸統馭；主玄德，友翼德，仇孟德，威震華夏，眼中漢賊最分明","先武穆而神，大漢千古，大宋千古；後文宣而聖，山東一人，山西一人","匹馬斬顏良，河北英雄齊喪膽；單刀會魯肅，江南名士盡低頭","此吳地也，不為孫郎立廟；今帝號矣！何須曹氏封侯"],"o":"補充：愛讀《春秋》；單刀會；山西人（孔子山東人）"},{"c":"忠臣名將","n":"周瑜","t":"周郎・公瑾","l":["顧曲有閒情，不礙破曹真事業；飲醇原雅量，偏嫌生亮並英雄","賠了夫人又折兵","青春南國喬出嫁；赤壁東風亮助攻","東風不與周郎便，銅雀春深鎖二喬","鳴箏金粟柱，素手玉房前；欲得周郎顧，時時誤拂絃","雄姿英發，羽扇綸巾，談笑間，檣櫓灰飛湮滅"],"o":"補充：「既生瑜，何生亮」；曲有誤，周郎顧；赤壁之戰"},{"c":"忠臣名將","n":"蘇武","t":"子卿・持節牧羊人","l":["為臣惟命敢辭難，脫遇艱難亦自安。試看子卿持節處，雪花如席不知寒"],"o":"補充：出使匈奴被扣，北海牧羊十九年，持節不屈"},{"c":"忠臣名將","n":"李廣","t":"飛將軍","l":["林暗草驚風，將軍夜引弓。平明尋白羽，沒在石稜中"],"o":"補充：「但使龍城飛將在，不教胡馬度陰山」；李廣難封"},{"c":"忠臣名將","n":"伍子胥","t":"伍員","l":["然後我的頭髮一根根叛變，鏡子裡，我已是祖父了"],"o":"補充：過昭關一夜白頭；鞭楚平王屍；吳國重臣"},{"c":"忠臣名將","n":"范蠡","t":"陶朱公","l":["久與君王共苦辛，功成身退步逡巡。五湖渺渺煙波闊，誰是扁舟第二人"],"o":"補充：輔佐句踐滅吳，攜西施泛五湖；經商致富"},{"c":"忠臣名將","n":"句踐","t":"越王","l":["苦心人，天不負，臥薪嘗膽，三千越甲可吞吳"],"o":"補充：臥薪嘗膽；吳越爭霸；與項羽「破釜沉舟」成對聯"},{"c":"忠臣名將","n":"劉備","t":"先主・玄德・昭烈帝","l":["天地英雄氣，千秋尚凜然。勢分三足鼎，業復五銖錢"],"o":"補充：三顧茅廬；白帝城託孤；兒子劉禪（阿斗）；劉禹錫〈蜀先主廟〉"},{"c":"忠臣名將","n":"包拯","t":"包公・包青天","l":["理冤獄，關節不通，自是閻羅氣象；賑災黎，慈悲無量，依然菩薩心腸"],"o":"補充：北宋清官；斷案如神；鐵面無私"},{"c":"忠臣名將","n":"方孝孺","t":"正學先生","l":["血染雨花鮮，為痛忠靈埋十族"],"o":"補充：不肯為明成祖草詔，被誅十族；血染雨花臺"},{"c":"忠臣名將","n":"吳鳳","t":"阿里山通事","l":["一死感山胞，盡翻青史無前例；八方瞻廟貌，猶說朱衣有舊痕"],"o":"補充：清代，捨身止「出草」陋習；阿里山吳鳳廟"},{"c":"忠臣名將","n":"比干","t":"殷代三仁之一","l":["臣心不死，即魂飛血濺，猶將以周日興，殷日喪"],"o":"補充：紂王叔父，強諫被剖心；微子、箕子並稱三仁"},{"c":"忠臣名將","n":"伯夷叔齊","t":"孤竹君之子","l":["幾根傲骨頭撐持天地，兩個餓肚皮包羅古今"],"o":"補充：恥食周粟，餓死首陽山；採薇而食；夷齊廟"},{"c":"楚漢爭霸與義士","n":"項羽","t":"西楚霸王・重瞳","l":["他是黑夜中，陡然迸發起來的一團天火，從江東熊熊焚燒到阿房宮，最後自火中提煉出一個霸氣磅礡的名字（現代詩）","他被雷聲風聲雨聲追趕至垓下，糧絕，兵盡，狂飆折斷纛旗，烏騅赫然咆哮，時不利兮可奈何（現代詩）","百戰疲勞壯士哀，中原一敗勢難回。江東子弟今雖在，肯與君王捲土來（王安石）","天意欲與劉，到此英雄難用武；人心猶慕項，至今父老尚稱王","此地疑仙，蓬萊、瀛洲、方丈；不知有漢，美人、名馬、英雄","爭帝圖王勢已傾，八千兵散楚歌聲；烏江不是無船渡，恥向東吳再起兵","有智者，事竟成，破釜沉舟，百二秦關終屬楚","千夫辟易楚重瞳，仁敬居然百戰中，博得美人心肯死，項王此處是英雄"],"o":"補充：破釜沉舟、四面楚歌、烏江自刎；杜牧「捲土重來」vs 王安石「肯與君王捲土來」"},{"c":"楚漢爭霸與義士","n":"韓信","t":"淮陰侯","l":["一飯何曾思報答，雙眸早已識英雄／生死一知己，存亡兩婦人","胯下辱磨英傑志，封侯榮誤將才生，都知烹狗藏功事？退在功成有幾人","鳥盡良弓勢必藏，千秋青史費評章。區區一飯猶圖報，爭肯為臣負漢王（包彬）","胯下王孫久見輕，誰知一躍竟成名；古來將相本無種，庸眾何為色不平"],"o":"補充：胯下之辱、漂母飯信；成也蕭何，敗也蕭何；死於呂后"},{"c":"楚漢爭霸與義士","n":"張良","t":"留侯・子房","l":["為帝者師，佐漢功原高將相；棄人間事，報韓心已了英雄","不握兵權只坐籌，苦辭萬戶乞討留。縱令不早尋仙去，天子終無賜醢謀（高啟）","壯士奮揮椎，報韓以落秦王膽；大王煩借箸，榮漢終函項羽頭","開濟由來變盛衰，五車才得號鎡基，留侯功業何容易，一卷兵書作帝師","滄海得壯士，椎秦博浪沙，報韓雖不成，天地皆振動","我來圯橋下，懷古欽英風。唯見碧流水，曾無黃石公","生叔季世，有豪俠心，報韓椎秦，興劉滅項；絕富貴交，為神仙侶，進履辟穀，拜石受書"],"o":"補充：博浪沙刺秦；圯上老人（黃石公）授兵書；〈留侯論〉"},{"c":"楚漢爭霸與義士","n":"荊軻","t":"燕太子丹之客","l":["此地別燕丹，壯士髮衝冠／易水蕭蕭西風冷，滿座衣冠似雪","君子死知己，提劍出燕京；素驥鳴廣陌，慷慨送我行","飲餞易水上，四座列群英；漸離擊悲筑，宋意唱高聲。心知去不歸，且有後世名","空流了太子的熱淚，隨森冷的易水，辜負了渡頭，風裡衣冠肅靜，一座似霜雪（現代詩）","身入狼邦，壯志匹夫生死外，心存燕國，蕭寒易水古今流"],"o":"補充：風蕭蕭兮易水寒；刺秦王；《史記・刺客列傳》"},{"c":"楚漢爭霸與義士","n":"秦始皇","t":"嬴政","l":["鯨吞六國帝人寰，遣使遙尋海上山。仙藥未來身已死，鑾輿空載鮑魚還"],"o":"補充：統一六國；求仙；死於沙丘，以鮑魚掩屍臭"},{"c":"楚漢爭霸與義士","n":"周文王","t":"姬昌・西伯","l":["蒙難觀爻，石徑蒺蔾皆卦象；拘幽作操，雲田柞棫亦琴材"],"o":"補充：被紂囚於羑里，演《周易》；周朝奠基者"},{"c":"巾幗佳人","n":"花木蘭","t":"代父從軍","l":["彎弓征戰作男兒，夢裡曾經與畫眉；幾度思歸還把酒，拂雲堆上祝明妃"],"o":"補充：〈木蘭詩〉；北朝民歌"},{"c":"巾幗佳人","n":"王昭君","t":"明妃・青塚","l":["一去紫臺連朔漠，獨留青塚向黃昏／歸來卻怪丹青手，當時枉殺毛延壽","群山萬壑赴荊門，生長明妃尚有村。畫圖省識春風面，環珮空歸月夜魂。千載琵琶作胡語，分明怨恨曲中論（杜甫詠懷古跡）","長信宮中長別離，當時豈亦有人欺？悠悠青塚胡沙裡，千載終為漢家死","一出塞無奈就天高地邈，一把慷慨的琵琶，憑她纖纖的手指，能彈壓幾千里的飛沙？（現代詩）","馬上琵琶關塞黑","飄飄秀色奪仙春，只恐丹青畫不真。能為君王罷徵戍，甘心玉骨葬胡塵","一回望月一回悲，望月月移人不移。何時得見漢朝使，為妾傳書斬畫師"],"o":"補充：和親匈奴；畫工毛延壽；杜甫〈詠懷古跡〉"},{"c":"巾幗佳人","n":"楊貴妃","t":"楊玉環・太真","l":["一騎紅塵妃子笑，無人知是荔枝來／名花傾國兩相歡，長得君王帶笑看","華清恩幸古無倫，猶恐蛾眉不勝人。未免被他褒女笑，只教天子暫蒙塵（李商隱）","漁陽鼙鼓動地來，驚破霓裳羽衣曲。六軍不發無奈何，宛轉蛾眉馬前死（長恨歌）","長安回望繡成堆，山頂千門次第開。一騎紅塵妃子笑，無人知是荔枝來（杜牧）","劇憐帝王風流，名花名酒；誰似太真佳寵，傾國傾城","是耶非耶？不見玉顏空死處；念茲在茲，忽聞海上有仙山","金釵墮地別君王，紅淚流珠滿御床，雲雨馬嵬分散後，驪宮不復舞霓裳"],"o":"補充：馬嵬坡；〈長恨歌〉；沉香亭、〈清平調〉"},{"c":"巾幗佳人","n":"西施","t":"浣紗女・越國美人","l":["一代傾城逐浪花，吳宮空自憶兒家；效顰莫笑東村女，頭白溪邊尚浣紗"],"o":"補充：東施效顰；吳越爭霸，美人計"},{"c":"巾幗佳人","n":"虞姬","t":"霸王別姬","l":["斷腸烏啼夜嘯風，虞兮幽恨對重瞳；黥彭甘受他年醢，飲劍何如楚帳中"],"o":"補充：項羽愛姬，垓下自刎；「虞兮虞兮奈若何」"},{"c":"巾幗佳人","n":"紅拂女","t":"風塵三俠之一","l":["長揖雄談態自殊，美人巨眼識窮途"],"o":"補充：慧眼識李靖，夜奔相隨；楊素家妓；虯髯客傳"},{"c":"巾幗佳人","n":"綠珠","t":"石崇愛妾","l":["日暮東風怨啼鳥，落花猶似墜樓人"],"o":"補充：為石崇墜樓殉情；杜牧〈金谷園〉"},{"c":"巾幗佳人","n":"唐明皇","t":"李隆基・唐玄宗","l":["曲奏霓裳，羽衣迴舞。唉，問玉人何處啊？玉人何處？如今啊！夕殿飛螢，孤燈獨對"],"o":"補充：寵楊貴妃；安史之亂；《長生殿》"},{"c":"聖賢史家","n":"孔子","t":"至聖先師・孔丘・仲尼","l":["道若江河，隨地可成洙泗；聖如日月，普天皆有春秋／泗水文章昭日月，杏壇禮樂  app.innerHTML=`<h1>${HOME_T}</h1><p class="sub">${HOME_S}</p>`+
 ORD.map(([k,v])=>`<button class="card lv" style="--c:${v.c}" data-l="${k}"><span class="e">${v.e}</span><span><b>${v.n}：${v.t}</b><small>每關 10 題</small></span><span class="st">${stars(st[k]||0)}</span></button>`).join("")+
 `<div class="card"><b>🧠 錯題本</b>（${nw} 題）<small style="color:var(--mu)">　答錯會自動收進來，連續答對 2 次才畢業</small><br><button class="btn" id="rv" ${nw?"":"disabled"}>複習錯題</button><button class="btn g" id="sh" ${nw?"":"disabled"}>🖨 列印我的錯題卷</button></div>
 <div class="card"><b>📥 題庫抽題與下載區</b><small style="color:var(--mu)">　自選範圍抽題，分「學生版／教師版」下載</small><br><button class="btn" id="bk">進入抽題區</button></div>
 <div class="card"><b>📽 上課投影模式</b><small style="color:var(--mu)">　大字、分組計分、按空白鍵揭曉</small><br>${ORD.map(([k,v])=>`<button class="btn g" data-p="${k}">${v.e} ${v.n}</button>`).join("")}</div>`;
 app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>start(gen(+b.dataset.l),+b.dataset.l));
 app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>proj(+b.dataset.p));
 $("#sh").onclick=sheet;$("#bk").onclick=bank;
 $("#rv").onclick=()=>{const q=Object.values(wb).map(x=>({...x.q,o:sh(x.q.o)}));start(pick(q,10),0)}}

const BK={sel:new Set([1,2,3,5,6,4]),n:20,items:null};
const tx=s=>String(s).replace(/<[^>]+>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
const XE=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function docxXml(items,teacher){const F='<w:rFonts w:ascii="Microsoft JhengHei" w:eastAsia="Microsoft JhengHei" w:hAnsi="Microsoft JhengHei"/>';
 const P=(t,o={})=>`<w:p><w:pPr>${o.c?'<w:jc w:val="center"/>':""}${o.ind?'<w:ind w:left="400"/>':""}<w:spacing w:after="${o.ind?140:40}"/></w:pPr><w:r><w:rPr>${F}${o.b?"<w:b/>":""}${o.col?`<w:color w:val="${o.col}"/>`:""}<w:sz w:val="${o.sz||22}"/></w:rPr><w:t xml:space="preserve">${XE(t)}</w:t></w:r></w:p>`;
 let b=P(TITLE+"　抽題卷（"+(teacher?"教師版":"學生版")+"）",{b:1,sz:36,col:"B3261E",c:1});
 b+=P(teacher?`共 ${items.length} 題・含解答與解析`:"班級：＿＿＿＿　座號：＿＿＿＿　姓名：＿＿＿＿＿＿　得分：＿＿＿＿",{col:"666666"});
 items.forEach((q,i)=>{b+=P(`（　）${i+1}. ${tx(q.s)}`,{b:1});b+=P(q.o.map((t,j)=>`(${"ABCD"[j]}) ${tx(t)}`).join("　　"),{ind:1})});
 if(teacher){b+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>'+P("解答與解析",{b:1,sz:32,col:"1E8A4C"});
  items.forEach((q,i)=>{b+=P(`${i+1}. ${"ABCD"[q.o.indexOf(q.a)]}　${tx(q.a)}　${tx(q.e)}`,{ind:1})})}
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1020" w:right="1020" w:bottom="1020" w:left="1020" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr></w:body></w:document>`}
async function mkDocx(items,teacher){const z=new JSZip();
 z.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
 z.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
 z.file("word/document.xml",docxXml(items,teacher));return z.generateAsync({type:"blob"})}
function bank(){document.body.classList.remove("big");
 app.innerHTML=`<h1>📥 題庫抽題與下載區</h1><p class="sub">自選範圍與題數抽出一份題組，再分別下載「學生版」與「教師版」（兩份來自同一次抽題）</p><div class="card"><b>① 選範圍</b>${ORD.map(([k,v])=>`<label style="display:block;margin:4px 0"><input type="checkbox" data-k="${k}" ${BK.sel.has(k)?"checked":""}> ${v.e} ${v.n}：${v.t}</label>`).join("")}<b>② 題數</b> <input id="nn" type="number" min="5" max="60" value="${BK.n}" style="width:72px;font:inherit"> 題<br><button class="btn" id="dr">🎲 抽題</button><button class="btn g" onclick="home()">返回首頁</button></div><div id="out"></div>`;
 app.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{c.checked?BK.sel.add(+c.dataset.k):BK.sel.delete(+c.dataset.k)});$("#dr").onclick=draw;if(BK.items)show()}
function draw(){BK.n=Math.max(5,Math.min(60,+$("#nn").value||20));const ks=ORD.map(x=>x[0]).filter(k=>BK.sel.has(k));
 if(!ks.length){$("#out").innerHTML='<p class="card">請至少選一個範圍。</p>';return}
 const per=Math.ceil(BK.n/ks.length)+3,seen=new Set;let all=[];ks.forEach(k=>gen(k,per).forEach(q=>{q.l=k;const id=key(q);if(!seen.has(id)){seen.add(id);all.push(q)}}));
 BK.items=pick(all,BK.n).sort((a,b)=>ks.indexOf(a.l)-ks.indexOf(b.l));show()}
function show(){const it=BK.items;$("#out").innerHTML=`<div class="card"><b>已抽出 ${it.length} 題</b>${it.length<BK.n?`<small style="color:var(--mu)">（所選範圍題庫不足 ${BK.n} 題，已全部抽出）</small>`:""}
 <div style="max-height:260px;overflow:auto;margin-top:8px;font-size:15px">${it.map((q,i)=>`<p>${i+1}. ${q.s.replace(/<small>.*?<\/small>/,"")}</p>`).join("")}</div></div>
 <div class="card" style="border-color:#1c7ed6"><b>🧒 學生版</b><small style="color:var(--mu)">　題目卷，答案欄空白，有姓名座號欄</small><br><button class="btn" data-d="0">下載 Word</button><button class="btn g" data-p="0">列印／存成 PDF</button></div>
 <div class="card" style="border-color:#c2255c"><b>👩‍🏫 教師版</b><small style="color:var(--mu)">　題目＋最後一頁解答與解析</small><br><button class="btn" data-d="1">下載 Word</button><button class="btn g" data-p="1">列印／存成 PDF</button></div><p id="msg" class="sub"></p>`;
 app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>dl(+b.dataset.d));app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>psheet(+b.dataset.p))}
async function dl(tc){const m=$("#msg");let d=null;try{d=await window.claude?.use("downloads")}catch(e){}
 if(!d){try{const bl=await mkDocx(BK.items,!!tc),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=(tc?"教師版":"學生版")+"_"+FN+".docx";document.body.appendChild(a);a.click();a.remove();m.textContent="✅ 已下載"}catch(e){m.textContent="下載失敗，請改用列印／存成 PDF。"}return}
 try{await d.save({filename:(tc?"教師版":"學生版")+"_"+FN+".docx",data:await mkDocx(BK.items,!!tc)});m.textContent="✅ 已送出下載"}catch(e){m.textContent=e&&e.code==="declined"?"已取消下載。":"下載失敗，請改用列印／存成 PDF。"}}
function psheet(tc){const it=BK.items;app.innerHTML=`<div class="noprint"><button class="btn" onclick="print()">🖨 列印／存成 PDF</button><button class="btn g" onclick="bank()">返回抽題區</button></div><h1>${TITLE}　抽題卷（${tc?"教師版":"學生版"}）</h1><p>${tc?"含解答與解析":"班級＿＿　座號＿＿　姓名＿＿　得分＿＿"}</p>`+it.map((q,i)=>`<div class="card"><div class="stem">（　）${i+1}. ${q.s}</div>${q.o.map((t,j)=>`<div>（${"ABCD"[j]}）${hl(t)}</div>`).join("")}</div>`).join("")+(tc?`<h2 style="break-before:page">解答與解析</h2>`+it.map((q,i)=>`<p>${i+1}. ${"ABCD"[q.o.indexOf(q.a)]}　${hl(q.a)}　${q.e}</p>`).join(""):"")}
function sheet(){const w=Object.values(LS.get(PFX+"_wb",{})).map(x=>x.q);app.innerHTML=`<div class="noprint"><button class="btn" onclick="print()">🖨 列印／存成 PDF</button><button class="btn g" onclick="home()">返回</button></div><h1>我的錯題卷</h1><p>班級＿＿　座號＿＿　姓名＿＿</p>`+w.map((q,i)=>`<div class="card"><div class="stem">${i+1}. ${q.s}</div>${q.o.map((t,j)=>`<div>（${"ABCD"[j]}）${hl(t)}</div>`).join("")}</div>`).join("")+`<h2 style="break-before:page">解答</h2>`+w.map((q,i)=>`<p>${i+1}. ${hl(q.a)}　${q.e}</p>`).join("")}
function start(qs,l){S={qs,l,i:0,ok:0,combo:0};ask()}
function ask(){const q=S.qs[S.i];if(!q)return end();
 app.innerHTML=`<div class="top"><span>${S.i+1}/${S.qs.length}</span><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><span>🔥${S.combo}　✅${S.ok}</span></div><div class="card"><div class="stem">${q.s}</div>${q.o.map((t,i)=>`<button class="o" data-i="${i}"><span>${"ABCD"[i]}</span><i style="font-style:normal">${hl(t)}</i></button>`).join("")}${q.h?`<button class="btn g" id="hn">💡 看提示</button> <span id="hv" style="color:var(--mu)"></span>`:""}<div class="ex" id="ex"></div><button class="btn" id="nx" hidden>下一題 ➜</button></div><button class="btn g" onclick="home()">離開</button>`;
 if($("#hn"))$("#hn").onclick=()=>{$("#hv").textContent=S.qs[S.i].h};
 app.querySelectorAll(".o").forEach(b=>b.onclick=()=>{const q=S.qs[S.i],t=q.o[+b.dataset.i],good=t===q.a;
  app.querySelectorAll(".o").forEach(x=>{x.disabled=true;if(q.o[+x.dataset.i]===q.a)x.classList.add("ok")});
  const wb=LS.get(PFX+"_wb",{}),k=key(q);
  if(good){S.ok++;S.combo++;b.classList.add("pop");if(wb[k]){wb[k].n++;if(wb[k].n>=2)delete wb[k]}}else{b.classList.add("no");S.combo=0;wb[k]={q:{s:q.s,o:q.o,a:q.a,e:q.e},n:0}}
  LS.set(PFX+"_wb",wb);$("#ex").innerHTML=(good?"🎉 答對了！":"💡 再記一次：")+"<br>"+q.e;$("#ex").classList.add("on");$("#nx").hidden=false;$("#nx").onclick=()=>{S.i++;ask()}})}
function end(){const k=S.ok>=9?3:S.ok>=7?2:S.ok>=5?1:0;if(S.l){const st=LS.get(PFX+"_st",{});st[S.l]=Math.max(st[S.l]||0,k);LS.set(PFX+"_st",st)}
 app.innerHTML=`<div class="card" style="text-align:center"><h1>${stars(k)}</h1><div class="stem">答對 ${S.ok} / ${S.qs.length}</div><p>${k==3?"${WIN}":k?"不錯喔，再玩一次衝三星！":"沒關係，答錯的已收進錯題本，複習後再挑戰！"}</p><button class="btn" onclick="home()">回首頁</button> <button class="btn g" id="ag">再玩一次</button></div>`;
 $("#ag").onclick=()=>S.l?start(gen(S.l),S.l):home()}
function proj(l){document.body.classList.add("big");let qs=gen(l),i=0,rev=0,tm=[0,0,0,0,0];
 const draw=()=>{const q=qs[i];app.innerHTML=`<div class="top"><b>${LV[l].e} ${LV[l].n}：${LV[l].t}</b><span>第 ${i+1} / ${qs.length} 題　［空白鍵／點畫面下方按鈕］</span><button class="btn g" id="x">離開</button></div><div class="card"><div class="stem">${q.s}</div>${q.o.map((t,j)=>`<div class="o ${rev&&t===q.a?"ok":""}"><span>${"ABCD"[j]}</span><i style="font-style:normal">${hl(t)}</i></div>`).join("")}<div class="ex ${rev?"on":""}">${q.e}</div></div><button class="btn" id="go">${rev?"下一題 ➜":"揭曉答案"}</button><div class="tm">${tm.map((v,j)=>`<div>第${j+1}組<b>${v}</b><button class="btn g" data-t="${j}">＋1</button><button class="btn g" data-m="${j}">－1</button></div>`).join("")}</div>`;
  $("#x").onclick=()=>{document.onkeydown=null;home()};$("#go").onclick=nx;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=e=>{e.stopPropagation();tm[+b.dataset.t]++;draw()});app.querySelectorAll("[data-m]").forEach(b=>b.onclick=e=>{e.stopPropagation();tm[+b.dataset.m]--;draw()})};
 const nx=()=>{if(!rev){rev=1}else{rev=0;i++;if(i>=qs.length){qs=gen(l);i=0}}draw()};
 document.onkeydown=e=>{if(e.code==="Space"||e.key==="ArrowRight"||e.key==="Enter"){e.preventDefault();nx()}};draw()}
home();
</script></body></html>
